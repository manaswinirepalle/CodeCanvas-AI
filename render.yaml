# CodeCanvas AI — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: codecanvas-db
    databaseName: codecanvas
    user: codecanvas
    plan: free
    region: oregon
    ipAllowList: []

services:
  # ─── Backend API ──────────────────────────────────────
  - type: web
    name: codecanvas-api
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @codecanvas/database run generate &&
      pnpm run build --filter @codecanvas/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: codecanvas-db
          property: connectionString
      - key: REDIS_URL
        value: redis://red-cr9k5e3v0jms73agoi1g:6379
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: NEXT_PUBLIC_APP_URL
        value: https://codecanvas-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://codecanvas-api.onrender.com
      - key: RATE_LIMIT_TTL
        value: 60
      - key: RATE_LIMIT_MAX
        value: 100
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4-turbo
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ─── Frontend Web ─────────────────────────────────────
  - type: web
    name: codecanvas-web
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm run build --filter @codecanvas/web
    startCommand: pnpm run start --filter @codecanvas/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://codecanvas-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://codecanvas-api.onrender.com
