databases:
  - name: codecanvas-db
    databaseName: codecanvas
    user: codecanvas
    plan: free
    region: oregon

services:
  - type: web
    name: codecanvas-api
    env: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codecanvas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: NEXT_PUBLIC_APP_URL
        value: https://codecanvas-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://codecanvas-api.onrender.com
      - key: RATE_LIMIT_TTL
        value: 60
      - key: RATE_LIMIT_MAX
        value: 100
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: codecanvas-web
    env: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm --filter @codecanvas/web run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://codecanvas-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://codecanvas-api.onrender.com
